services: 

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_APP_API:http://localhost:5000/api
      dockerfile: Dockerfile
    
    container_name: mern-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks: 
      - mern-network
  
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile

    container_name: mern-backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      DATABASE: mongodb://mongodb:27017/mernapp
    
    depends_on:
      - mongodb

    networks:
      - mern-network
  
  mongodb:
    image: mongo:8

    container_name: mern-mongodb

    restart: unless-stopped

    volumes:
      - mongodb_data:/data/DATABASE
    networks:
      - mern-network

volumes:
  mongodb_data:

networks:
  mern-network:
    driver: bridge